name: Testes

on: [push, pull_request]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar data.js
        run: node validate-data.js
      - name: Testes da lógica do quiz
        run: node --test tests/scoring-test.js
      - name: Teste de cobertura (todo curso consegue ser o 1º)
        run: node tests/coverage-test.js
